[supervisord]
nodaemon=false
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:backend]
command=bash -c "cd /home/z/my-project/DataMonitor/mini-services/backend && source venv/bin/activate && uvicorn index:app --host 0.0.0.0 --port 3001"
directory=/home/z/my-project/DataMonitor/mini-services/backend
autostart=true
autorestart=true
stdout_logfile=/tmp/backend.log
stderr_logfile=/tmp/backend.log

[program:frontend]
command=bash -c "cd /home/z/my-project/DataMonitor && npx next dev -p 3000"
directory=/home/z/my-project/DataMonitor
autostart=true
autorestart=true
stdout_logfile=/tmp/frontend.log
stderr_logfile=/tmp/frontend.log
